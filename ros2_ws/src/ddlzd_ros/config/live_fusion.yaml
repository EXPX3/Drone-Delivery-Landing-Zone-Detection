# Shared algorithm configuration. A sensor profile is layered on top by the
# live or bag launch file; hardware bindings remain launch arguments.
/landing_zone/live_landing_zone:
  ros__parameters:
    operating_mode: ranking
    local_frame_convention: enu
    local_pose_topic: /mavros/local_position/pose
    gnss_topic: /mavros/global_position/global
    input_is_motion_compensated: false
    deskew_tf_sampling_sec: 0.002
    rolling_window_sec: 3.0
    detection_period_sec: 0.5
    local_map_radius_m: 30.0
    tf_timeout_sec: 0.10
    max_cloud_age_sec: 0.5
    max_scan_duration_sec: 0.5

    detector:
      algorithm: region_growing_exact_radius
      # landing_radius_m is intentionally not configurable: this branch enforces 2.5 m.
      # The exact-radius demo uses no expansion; set from a measured navigation/control error budget if required.
      safety_margin_m: 0.0
      obstacle_search_radius_m: 12.0
      candidate_spacing_m: 0.75
      nms_distance_m: 1.0
      voxel_leaf_m: 0.10
      plane_inlier_threshold_m: 0.08
      region_smoothness_deg: 6.0
      curvature_threshold: 0.08
      obstacle_height_m: 0.0
      max_slope_deg: 12.0
      min_density_m2: 8.0
      max_relief_m: 5.0
      max_roughness_m: 2.0
      min_observed_fraction: 0.70
      min_plane_points: 120
      normal_neighbors: 30
      obstacle_min_points: 0
      angular_bins: 36
      radial_bins: 5
      max_candidates: 200

    risk:
      # Geometry-only score weights are defined in ddlzd_core/src/risk.cpp.
      safest_threshold: 0.33
      safe_threshold: 0.62
      minimum_clearance_coverage: 0.55
      slope_good_deg: 0.0
      slope_bad_deg: 8.0
      relief_good_m: 0.10
      relief_bad_m: 4.50
      roughness_good_m: 0.03
      roughness_bad_m: 0.55
      clearance_bad_m: 2.0
      clearance_good_m: 12.0
      obstacle_bad_count: 80.0
      observed_bad_fraction: 0.70
      observed_good_fraction: 0.95

    tracking:
      match_distance_m: 1.0
      timeout_sec: 2.0
      risk_filter_alpha: 0.35
      position_filter_alpha: 0.35
      minimum_stable_observations: 3

    selection:
      dropout_timeout_sec: 1.5
      max_missed_detections: 3
      soft_release_observations: 2

    gnss:
      sync_tolerance_sec: 0.50
      sample_retention_sec: 5.0
      require_known_covariance: false
      max_horizontal_uncertainty_m: 10.0

    visualization:
      ranking_alpha: 0.90
      sticky_background_alpha: 0.22
      selected_alpha: 1.0

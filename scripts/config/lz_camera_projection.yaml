calibration:
  # Change to measured only after validating all values below against calibration data.
  status: provisional
  notes:
    - Intrinsics came from the CargoPack camera code at 1920x1080.
    - Recorded 1280x720 images are treated as full-frame 2/3 resizes.
    - Camera is modeled as a rigid nadir mount; UAV attitude supplies roll, pitch, and heading.
    - Vertical datum offset is constrained by the grounded interval in this bag.

topics:
  image: /GremsyVIO/image/cpu
  lidar_points: /velodyne_points
  gps: /mavros/global_position/global
  tf: /tf
  tf_static: /tf_static

frames:
  map: map
  base: base_link
  camera_chain: [map, base_link, altax_center_flu, camera_body_flu]
  lidar_chain: [map, base_link, altax_center_flu, velodyne]

dynamic_occupancy:
  # Sparse endpoint occupancy. A voxel must be observed repeatedly before it can
  # affect a landing zone, suppressing isolated returns and registration noise.
  # Multi-resolution occupancy: fine only around candidate landing footprints,
  # coarse elsewhere. This mirrors adaptive octree depth and keeps safety tests
  # precise without paying the fine-grid cost over the whole Bayern tile.
  resolution_m: 0.20
  coarse_resolution_m: 1.00
  interest_padding_m: 1.0
  confirmation_hits: 2
  confirmation_window_scans: 3
  # Restore a rejected footprint only after repeated scans densely observe its
  # ground surface with no elevated cluster. Absence of returns is not free.
  hazard_clear_after_scans: 10
  hazard_clearing_radius_m: 20.0
  clear_ground_tolerance_m: 0.12
  clear_grid_resolution_m: 0.50
  clear_minimum_ground_points: 20
  clear_minimum_coverage: 0.25
  # The first reliable cargo semantic support in this bag appears roughly 40 s
  # after the earliest geometric block. At 10 Hz, 450 scans allow classification
  # before reversible free-space evidence can reopen an unclassified footprint.
  clear_minimum_hazard_age_scans: 450
  maximum_lidar_range_m: 80.0
  # Safety revalidation is local below the UAV; the full map is still fused and
  # displayed independently.
  rolling_horizontal_radius_m: 10.0
  # Preserve every return for obstacle and semantic processing. Only the
  # evolving visualization/map fusion stream is downsampled for efficiency.
  point_stride: 1
  map_point_stride: 3
  publish_hz: 5.0
  zone_publish_hz: 10.0
  max_visualized_voxels: 20000
  # RViz transport cap only; the internal occupancy state remains complete.
  max_visualized_map_points: 150000
  # Reuse the risk model's wind/GNSS margin. Confirmed occupancy inside a zone
  # blocks it; occupancy inside this outer margin downgrades it to risky.
  gps_wind_margin_m: 2.0
  # Mission requirement: reject obstacles at least 0.15 m above local ground.
  # Do not subtract registration uncertainty from this physical threshold:
  # the rolling plane below removes the common local vertical offset directly.
  obstacle_min_height_m: 0.15
  vertical_clearance_m: 5.0
  # Robust plane fitted once per LiDAR scan around the UAV ground projection.
  # It covers the same 10 m safety-processing ROI, avoiding asynchronous camera
  # centering and thousands of redundant candidate-by-candidate plane fits.
  local_ground_plane:
    enabled: true
    radius_m: 10.0
    ransac_distance_threshold_m: 0.10
    maximum_slope_deg: 20.0
    minimum_inliers: 80
    ransac_iterations: 48
    maximum_fit_points: 4000
  point_clustering:
    enabled: true
    radius_m: 0.25
    minimum_points_near: 5
    minimum_points_mid: 4
    minimum_points_far: 3
    # Dense, clearly elevated clusters block on their first scan. Borderline
    # clusters retain the two-of-three temporal confirmation above.
    immediate_minimum_points_near: 8
    immediate_minimum_points_mid: 6
    immediate_minimum_points_far: 5
    immediate_minimum_height_m: 0.30
    near_range_m: 10.0
    mid_range_m: 20.0
    far_range_m: 40.0
    beyond_far_confirmation_hits: 3
  # RViz-only lift keeps rings above voxel faces; geometry and camera projection
  # continue to use the measured landing-surface elevation.
  zone_visual_lift_m: 0.65
  # Replay the frozen bag-only trajectory that reduced held-out vertical RMSE
  # from 0.4036 m to 0.0583 m. This is exact for this recorded experiment;
  # a real sensor requires the causal sliding-window variant.
  validated_pose_replay:
    enabled: true
    maximum_timestamp_error_s: 0.03

camera:
  calibration_size: [1920, 1080]
  matrix:
    - [1328.70412, 0.0, 945.511916]
    - [0.0, 1440.59216, 575.929244]
    - [0.0, 0.0, 1.0]
  distortion: [0.05724215, -0.23188819, -0.00854506, -0.00473153, 0.06875864]
  # Rigid nadir mount in camera_body_flu: image right is body right (-Y), image
  # down is body rear (-X), and optical forward is body down (-Z).
  mount_to_optical:
    translation_m: [0.0, 0.0, 0.0]
    quaternion_xyzw: [0.7071067812, -0.7071067812, 0.0, 0.0]
  expected_nadir: true
  maximum_nadir_tilt_deg: 30.0

registration:
  minimum_trajectory_baseline_m: 10.0
  maximum_horizontal_rmse_m: 5.0
  # Ellipsoidal GNSS minus Bayern LiDAR/DHHN height. The value is calibrated so
  # the minimum recorded altitude during the known grounded interval meets the
  # local ground surface (45.0 m left the vehicle 3.913 m above the terrain).
  lz_to_gnss_vertical_offset_m: 48.913
  # ICP fit of 240 registered Velodyne frames against the Bayern static cloud.
  # Applied around the static-cloud origin after map -> orthometric conversion.
  live_lidar_to_static:
    method: robust_point_to_point_icp
    sample_frames: 240
    # Translation re-expressed for the 48.913 m vertical datum while preserving
    # the previously fitted point positions and rotation.
    translation_m: [0.107891, -0.092773, 2.272681]
    quaternion_xyzw: [-0.001844951, 0.012873635, 0.000334794, 0.999915373]
    median_residual_m: 0.2443
    p75_residual_m: 0.3177

synchronization:
  max_tf_gap_s: 0.25

output:
  fps: 15.0
  fill_alpha: 0.35

semantic_segmentation:
  enabled: true
  # TAG: GROUND_REFERENCE_ABLATION
  # Options: bayern_ground_reference, local_detection_ground_reference
  ground_reference_mode: bayern_ground_reference
  local_detection_ground:
    radius_m: 5.0
    ransac_distance_threshold_m: 0.15
    maximum_slope_deg: 20.0
    minimum_inliers: 20
    ransac_iterations: 96
  # Open-vocabulary prompts cover objects absent from COCO's fixed taxonomy.
  # Appearance-specific wording raises the observed white-topped box from
  # 0.0146 ("white cargo box") to 0.3586 without lowering the global threshold.
  prompts: [person, black rectangular obstacle, white rectangular obstacle, cardboard package, car]
  confidence: 0.05
  image_size: 1280
  device: 0
  inference_stride: 3
  maximum_lidar_age_s: 0.15
  # Reject terrain returns that project through an object mask.
  minimum_height_above_ground_m: 0.15
  maximum_height_above_ground_m: 5.0
  vision_guided_lidar:
    # Vision selects a region to inspect but cannot block a zone by itself.
    minimum_image_confidence:
      # Open-vocabulary scores are not calibrated probabilities. These gates
      # are paired with elevated compact 3D support below.
      person: 0.30
      # The appearance-specific black-box prompt scores 0.1056 on the verified
      # missed frame. Safety still additionally requires elevated LiDAR points.
      cargo_box: 0.10
      vehicle: 0.08
    # Reject pathological masks such as the observed 65.3%-of-image cargo mask.
    maximum_mask_fraction:
      person: 0.05
      cargo_box: 0.08
      vehicle: 0.15
    minimum_lidar_points_by_class:
      person: 2
      cargo_box: 2
      vehicle: 5
    maximum_radial_p95_m:
      person: 0.80
      cargo_box: 0.75
      vehicle: 3.50
    minimum_lidar_points_per_frame: 2
    # Require independent temporal support, then retain the confirmed object in
    # RViz for cross-pass comparison. Safety refresh remains separately bounded.
    confirmation_frames: 3
    cluster_radius_m: 0.75
    association_radius_m: 0.90
    # Duplicate tracks from projection error merge well below the measured
    # 5.9 m minimum spacing between distinct cargo boxes.
    duplicate_merge_radius_m: 1.50
    confirmed_duplicate_merge_radius_m: 2.50
    static_voxel_size_m: 0.10
    # Applies to dynamic classes such as people. Cargo and vehicles persist and
    # accumulate support; dynamic tracks retain only their current point set.
    maximum_age_frames: 30
    safety_maximum_age_frames: 90
    history_size: 60

